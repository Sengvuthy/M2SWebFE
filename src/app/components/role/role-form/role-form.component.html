<div class="card card-gradient p-3">
  <div class="card-body">
    <div class="m-sm-3">
      <form [formGroup]="form" (ngSubmit)="save()">
        <!-- Role Name -->
        <div class="mb-3">
          <label class="form-label">Role Name</label>
          <input
            class="form-control form-control-lg"
            type="text"
            formControlName="roleName"
            placeholder="Enter role name"
            [class.is-invalid]="form.controls['roleName'].invalid && form.controls['roleName'].touched"
          />
          <div class="invalid-feedback" *ngIf="form.controls['roleName'].errors?.['required']">
            Role name is required.
          </div>
          <div class="invalid-feedback" *ngIf="form.controls['roleName'].errors?.['minlength']">
            Role name must be at least 2 characters.
          </div>
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label class="form-label">Description</label>
          <input
            class="form-control form-control-lg"
            type="text"
            formControlName="description"
            placeholder="Enter description (optional)"
          />
        </div>

        <!-- Buttons -->
        <div class="d-flex justify-content-end gap-2 mt-3">
          <button type="submit" class="jelly-btn-sky" [disabled]="isSubmitted || form.invalid">
            {{ roleId ? 'Update Role' : 'Create Role' }}
          </button>
          <button type="button" class="jelly-btn-sky" (click)="cancel()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
