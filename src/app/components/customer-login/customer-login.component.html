<app-customer-header></app-customer-header>

<main class="card card-gradient p-3">
  <div class="container d-flex flex-column">
    <div class="row vh-100">
      <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5 mx-auto d-table h-100">
        <div class="d-table-cell align-middle">
          <div class="text-center mt-4">
            <h1 class="h2">{{ 'CUSTOMER_LOGIN' | translate }}</h1>
          </div>
          <div class="card card-flat" style="background-color: #addaf8;">
            <div class="m-sm-3">
              <form [formGroup]="loginForm" (ngSubmit)="signIn()">
                <div class="mb-3">
                  <label class="form-label">{{ 'PHONE_NUMBER' | translate }}</label>
                  <input class="form-control form-control-lg" type="text" formControlName="phone"
                         placeholder="{{ 'ENTER_PHONE_NUMBER' | translate }}" />
                </div>
                <div class="d-grid gap-2 mt-3">
                  <button type="submit" class="btn btn-lg btn-primary">
                    {{ 'SIGN_IN' | translate }}
                  </button>
                  <button type="button" class="btn btn-secondary mt-2" (click)="goToSignUp()">
                    {{ 'SIGN_UP_PROMPT' | translate }}
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
