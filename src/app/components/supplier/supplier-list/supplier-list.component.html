<div class="header-flat">

  <!-- 🔍 Search Filters -->
  <div class="col-12 mb-1">
    <form (ngSubmit)="search()">
      <div class="input-group">
        <input
          type="text"
          class="form-control"
          placeholder="Search by supplier name..."
          [(ngModel)]="searchName"
          name="searchName"
        />
        <button type="submit" class="btn btn-primary">Search</button>
        <button
          type="button"
          class="btn btn-outline-secondary ms-2"
          style="background-color: #a7a29d;"
          (click)="clearSearch()"
        >
          Clear
        </button>
      </div>
    </form>
  </div>

  <!-- ⏳ Loading Indicator -->
  <div *ngIf="isLoading" class="text-center p-3">
    Loading suppliers...
  </div>

  <!-- 📋 Supplier Table -->
  <div *ngIf="!isLoading" class="col-12 d-flex">
    <div class="card flex-fill">

      <!-- ⭐ Header Row -->
      <div class="d-flex justify-content-between align-items-center px-3 py-1 rounded shadow-sm mb-1 header-flat">
        <button class="btn btn-success btn-sm" [routerLink]="['/supplier/form']">
          Create Supplier
        </button>
        <h5 class="text-center flex-grow-1 mb-0" style="font-size: 1rem;">Supplier List</h5>
        <div class="d-flex gap-2 ms-3">
          <button class="btn btn-warning btn-sm" style="background-color: #f58718;" (click)="importSuppliers()">
            Import Suppliers
          </button>
        </div>
      </div>

      <table class="table table-hover my-0 table-flat">
        <thead>
          <tr style="font-size: 0.9rem;">
            <th (click)="sort('id')" style="cursor:pointer">
              ID
              <span *ngIf="sortBy === 'id'">{{ sortDir === 'asc' ? '▼' : '▲' }}</span>
            </th>
            <th (click)="sort('name')" style="cursor:pointer">
              Supplier Name
              <span *ngIf="sortBy === 'name'">{{ sortDir === 'asc' ? '▼' : '▲' }}</span>
            </th>
            <th (click)="sort('phone')" style="cursor:pointer">
              Phone
              <span *ngIf="sortBy === 'phone'">{{ sortDir === 'asc' ? '▼' : '▲' }}</span>
            </th>
            <th>Email</th>
            <th>Address</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let s of suppliers" style="font-size: 0.9rem;">
            <td style="padding: 0.3rem 0.5rem;">{{ s.id }}</td>
            <td style="padding: 0.3rem 0.5rem;">{{ s.name }}</td>
            <td style="padding: 0.3rem 0.5rem;">{{ s.phone }}</td>
            <td style="padding: 0.3rem 0.5rem;">{{ s.email }}</td>
            <td style="padding: 0.3rem 0.5rem;">{{ s.address }}</td>
            <td class="text-center" style="padding: 0.3rem 0.5rem;">
              <button class="btn btn-primary btn-sm me-2" (click)="editSupplier(s.id)">Edit</button>
              <button class="btn btn-danger btn-sm" (click)="deleteSupplier(s.id)">Delete</button>
            </td>
          </tr>
          <tr *ngIf="suppliers.length === 0">
            <td colspan="6" class="text-center">No suppliers found</td>
          </tr>
        </tbody>
      </table>

      <!-- 📑 Pagination -->
      <div class="card-footer text-center py-1 footer-flat">
        <button class="btn btn-secondary me-2" [disabled]="page === 1" (click)="prevPage()" style="padding: 0.3rem 0.5rem;">
          Previous
        </button>
        <ng-container *ngFor="let p of pageNumbers">
          <button
            class="btn mx-1"
            [ngClass]="page === p ? 'btn-primary' : 'btn-outline-primary'"
            (click)="goToPage(p)"
            style="padding: 0.3rem 0.5rem;"
          >
            {{ p }}
          </button>
        </ng-container>
        <button class="btn btn-secondary ms-2" [disabled]="page === totalPages" (click)="nextPage()" style="padding: 0.3rem 0.5rem;">
          Next
        </button>
      </div>

    </div>
  </div>
</div>
