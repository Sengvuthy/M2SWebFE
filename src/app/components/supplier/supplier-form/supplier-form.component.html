<div class="card card-gradient p-3">
  <div class="card-body">
    <div class="m-sm-3">
      <form [formGroup]="supplierForm" (ngSubmit)="saveSupplier()">

        <!-- Supplier Name -->
        <div class="mb-3">
          <label class="form-label">Supplier Name</label>
          <input
            class="form-control form-control-lg"
            type="text"
            formControlName="name"
            placeholder="Enter supplier name"
            [class.is-invalid]="supplierForm.controls['name'].invalid && supplierForm.controls['name'].touched"
            />
            @if (supplierForm.controls['name'].errors?.['required']) {
              <div class="invalid-feedback">
                Supplier name is required.
              </div>
            }
            @if (supplierForm.controls['name'].errors?.['minlength']) {
              <div class="invalid-feedback">
                Supplier name must be at least 2 characters.
              </div>
            }
          </div>

          <!-- Phone -->
          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input
              class="form-control form-control-lg"
              type="text"
              formControlName="phone"
              placeholder="Enter phone number"
              />
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input
                class="form-control form-control-lg"
                type="email"
                formControlName="email"
                placeholder="Enter email"
                />
              </div>

              <!-- Address -->
              <div class="mb-3">
                <label class="form-label">Address</label>
                <input
                  class="form-control form-control-lg"
                  type="text"
                  formControlName="address"
                  placeholder="Enter address"
                  />
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-end gap-2 mt-3">
                  <button
                    type="submit"
                    class="jelly-btn-sky"
                    [disabled]="isSubmitted || supplierForm.invalid"
                    >
                    {{ supplierId ? 'Update Supplier' : 'Create Supplier' }}
                  </button>
                  <button type="button" class="jelly-btn-sky" (click)="cancel()">Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
