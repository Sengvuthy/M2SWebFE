<div class="card card-gradient p-3">
  <div class="card-body">
    <div class="m-sm-3">
      <form [formGroup]="customerForm" (ngSubmit)="saveCustomer()">

        <!-- Name -->
        <div class="mb-3">
          <label class="form-label">Customer Name</label>
          <input
            class="form-control form-control-lg"
            type="text"
            formControlName="name"
            placeholder="Enter customer name"
            [class.is-invalid]="customerForm.controls['name'].invalid && customerForm.controls['name'].touched"
          />
          <div class="invalid-feedback" *ngIf="customerForm.controls['name'].errors?.['required']">
            Name is required.
          </div>
          <div class="invalid-feedback" *ngIf="customerForm.controls['name'].errors?.['minlength']">
            Name must be at least 2 characters.
          </div>
        </div>

        <!-- Phone -->
        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <input
            class="form-control form-control-lg"
            type="text"
            formControlName="phone"
            placeholder="Enter phone number"
          />
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            class="form-control form-control-lg"
            type="email"
            formControlName="email"
            placeholder="Enter email"
            [class.is-invalid]="customerForm.controls['email'].invalid && customerForm.controls['email'].touched"
          />
          <div class="invalid-feedback" *ngIf="customerForm.controls['email'].errors?.['email']">
            Please enter a valid email.
          </div>
        </div>

        <!-- Address -->
        <div class="mb-3">
          <label class="form-label">Address</label>
          <input
            class="form-control form-control-lg"
            type="text"
            formControlName="address"
            placeholder="Enter address"
          />
        </div>

        <!-- Default Flag -->
        <!-- <div class="form-check mb-3">
          <input
            class="form-check-input"
            type="checkbox"
            formControlName="isDefault"
            id="isDefault"
          />
          <label class="form-check-label" for="isDefault">
            Set as default customer
          </label>
        </div> -->

        <!-- Buttons -->
        <div class="d-flex justify-content-end gap-2 mt-3">
          <button type="submit" class="jelly-btn-sky" [disabled]="isSubmitted || customerForm.invalid">
            {{ customerId ? 'Update Customer' : 'Create Customer' }}
          </button>
          <button type="button" class="jelly-btn-sky" (click)="cancel()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
