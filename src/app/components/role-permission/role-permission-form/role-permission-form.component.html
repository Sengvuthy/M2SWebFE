<div class="card card-gradient p-3">
  <div class="card-body">
    <div class="m-sm-3">
      <form [formGroup]="form" (ngSubmit)="save()">

        <!-- 🆔 Role Dropdown -->
        <div class="mb-3">
          <label class="form-label fw-bold">Role *</label>
          @if (isLoadingRoles) {
            <div class="text-muted">Loading roles...</div>
          }
          <select class="form-select form-select-lg" formControlName="roleId" [disabled]="isLoadingRoles">
            <option value="">-- Select Role --</option>
            @for (r of roles; track r) {
              <option [value]="r.id">
                {{ r.id }} - {{ r.roleName }}
              </option>
            }
          </select>
        </div>

        <!-- 🆔 Permission Dropdowns (Static FormArray) -->
        <div class="mb-3">
          <label class="form-label fw-bold">Permissions *</label>
          @if (isLoadingPermissions) {
            <div class="text-muted">Loading permissions...</div>
          }

          @for (ctrl of permissionControls; track ctrl) {
            <div class="mb-2">
              <select
                class="form-select form-select-lg"
                [formControl]="ctrl"
                [disabled]="isLoadingPermissions"
                [class.is-invalid]="ctrl.invalid && ctrl.touched">
                <option value="">-- Select Permission --</option>
                @for (p of permissions; track p) {
                  <option [value]="p.id">
                    {{ p.id }} - {{ p.permissionName }}
                  </option>
                }
              </select>
              @if (ctrl.errors?.['required'] && ctrl.touched) {
                <div class="invalid-feedback d-block">
                  Permission is required.
                </div>
              }
            </div>
          }
        </div>

        <!-- ❗ Error Message -->
        @if (errorMsg) {
          <div class="alert alert-danger">{{ errorMsg }}</div>
        }

        <!-- ✅ Action Buttons -->
        <div class="d-flex justify-content-end gap-2 mt-3">
          <button type="submit" class="jelly-btn-sky" [disabled]="isSubmitted || form.invalid">
            Assign Role-Permissions
          </button>
          <button type="button" class="jelly-btn-sky" (click)="cancel()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
