<!-- Language selection screen (first time only) -->
<div *ngIf="showLanguageSelection; else mainApp"
  class="d-flex flex-column align-items-center justify-content-center vh-100">  

  <!-- Title -->
  <h2>{{ 'CHOOSE_LANGUAGE' | translate }}</h2>

  <!-- Flags grid -->
  <div class="row mt-3 justify-content-center text-center gx-2 gy-2">

    <!-- English -->
    <div class="col-6 col-md-3">
      <button class="btn flag-btn" (click)="chooseLanguage('en')">
        <img src="assets/flags/uk.png" alt="English" width="60" height="40">
      </button>
      <div class="mt-1">English</div>
    </div>

    <!-- Khmer -->
    <div class="col-6 col-md-3">
      <button class="btn flag-btn" (click)="chooseLanguage('khm')">
        <img src="assets/flags/cambodia.png" alt="Khmer" width="60" height="40">
      </button>
      <div class="mt-1">ភាសាខ្មែរ</div>
    </div>

    <!-- Chinese -->
    <div class="col-6 col-md-3">
      <button class="btn flag-btn" (click)="chooseLanguage('ch')">
        <img src="assets/flags/chinese.png" alt="Chinese" width="60" height="40">
      </button>
      <div class="mt-1">中文</div>
    </div>

    <!-- Vietnamese -->
    <div class="col-6 col-md-3">
      <button class="btn flag-btn" (click)="chooseLanguage('vn')">
        <img src="assets/flags/vietnamese.png" alt="Vietnamese" width="60" height="40">
      </button>
      <div class="mt-1">Tiếng Việt</div>
    </div>

  </div>
</div>

<!-- Main app layout -->
<ng-template #mainApp>
  <div class="wrapper">
    <app-sidebar *ngIf="showSidebar" [isLoggedIn]="isLoggedIn" (logoutEvent)="switchView($event)">
    </app-sidebar>
    <div class="main">
      <main class="content">
        <div class="container-fluid p-0">
          <router-outlet (activate)="onActivate($event)"></router-outlet>
        </div>
      </main>
    </div>
  </div>
</ng-template>
